<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" fill="none">
    <defs>
        <!-- Breathtaking Logo Gradient from Bright Cyan to Indigo Blue -->
        <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0052D4" />
            <stop offset="50%" stop-color="#00b4db" />
            <stop offset="100%" stop-color="#00f2fe" />
        </linearGradient>
        
        <!-- Soft Cyan Glow Effect for nodes -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Base Network Grid Connections (Constellations) -->
    <g stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <!-- Left Symmetrical Grid Constellation -->
        <line x1="130" y1="520" x2="270" y2="440" />
        <line x1="270" y1="440" x2="310" y2="520" />
        <line x1="130" y1="520" x2="310" y2="520" />
        
        <line x1="130" y1="520" x2="200" y2="390" />
        <line x1="200" y1="390" x2="270" y2="440" />
        <line x1="200" y1="390" x2="310" y2="360" />
        <line x1="270" y1="440" x2="310" y2="360" />
        
        <line x1="200" y1="390" x2="290" y2="260" />
        <line x1="290" y1="260" x2="310" y2="360" />
        
        <line x1="290" y1="260" x2="340" y2="140" />
        <line x1="340" y1="140" x2="400" y2="160" />
        <line x1="340" y1="140" x2="400" y2="50" />

        <!-- Right Symmetrical Grid Constellation -->
        <line x1="670" y1="520" x2="530" y2="440" />
        <line x1="530" y1="440" x2="490" y2="520" />
        <line x1="670" y1="520" x2="490" y2="520" />
        
        <line x1="670" y1="520" x2="600" y2="390" />
        <line x1="600" y1="390" x2="530" y2="440" />
        <line x1="600" y1="390" x2="490" y2="360" />
        <line x1="530" y1="440" x2="490" y2="360" />
        
        <line x1="600" y1="390" x2="510" y2="260" />
        <line x1="510" y1="260" x2="490" y2="360" />
        
        <line x1="510" y1="260" x2="460" y2="140" />
        <line x1="460" y1="140" x2="400" y2="160" />
        <line x1="460" y1="140" x2="400" y2="50" />
    </g>

    <!-- Symmetrical Bridge Lines to the Central Tree -->
    <g stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
        <line x1="310" y1="360" x2="360" y2="380" />
        <line x1="490" y1="360" x2="440" y2="380" />
    </g>

    <!-- Symmetrical Digital Tree Trunk & Organic Branches -->
    <g stroke="url(#logoGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Symmetrical Trunk Base Flare -->
        <path d="M 370,535 C 375,510 385,460 385,420 L 385,320" stroke-width="11" />
        <path d="M 430,535 C 425,510 415,460 415,420 L 415,320" stroke-width="11" />
        
        <!-- Center Trunk Path -->
        <path d="M 400,535 L 400,240" stroke-width="7" />

        <!-- Left Branch Sweeps -->
        <path d="M 385,420 C 350,410 330,370 300,380" stroke-width="6.5" />
        <path d="M 385,350 C 350,330 345,250 300,280" stroke-width="6" />
        <path d="M 400,270 C 370,250 360,180 310,210" stroke-width="5" />

        <!-- Right Branch Sweeps -->
        <path d="M 415,420 C 450,410 470,370 500,380" stroke-width="6.5" />
        <path d="M 415,350 C 450,330 455,250 500,280" stroke-width="6" />
        <path d="M 400,270 C 430,250 440,180 490,210" stroke-width="5" />
        
        <!-- Top Crown Splitting Branches -->
        <path d="M 400,240 C 392,190 395,130 400,50" stroke-width="7.5" />
        <path d="M 400,195 C 380,165 385,115 400,160" stroke-width="6" />
    </g>

    <!-- Constellation Nodes (Connected Circles) -->
    <g fill="#070a13" stroke="url(#logoGrad)" stroke-width="4.5" filter="url(#glow)">
        <!-- Outer Boundary Nodes (Cyan-Blue Solid Fills) -->
        <circle cx="400" cy="50" r="18" fill="url(#logoGrad)" stroke="#fff" stroke-width="2" />
        
        <!-- Symmetrical Corners -->
        <circle cx="130" cy="520" r="17" fill="url(#logoGrad)" stroke="#fff" stroke-width="2" />
        <circle cx="670" cy="520" r="17" fill="url(#logoGrad)" stroke="#fff" stroke-width="2" />
        
        <!-- Left Side Nodes -->
        <circle cx="200" cy="390" r="13" />
        <circle cx="290" cy="260" r="13" />
        <circle cx="340" cy="140" r="13" />
        
        <!-- Right Side Nodes -->
        <circle cx="600" cy="390" r="13" />
        <circle cx="510" cy="260" r="13" />
        <circle cx="460" cy="140" r="13" />

        <!-- Internal Symmetrical Nodes -->
        <circle cx="270" cy="440" r="11" />
        <circle cx="310" cy="520" r="14" fill="url(#logoGrad)" />
        <circle cx="310" cy="360" r="14" fill="url(#logoGrad)" />
        
        <circle cx="530" cy="440" r="11" />
        <circle cx="490" cy="520" r="14" fill="url(#logoGrad)" />
        <circle cx="490" cy="360" r="14" fill="url(#logoGrad)" />

        <!-- Center Splitting Node -->
        <circle cx="400" cy="160" r="16" fill="url(#logoGrad)" stroke="#fff" stroke-width="1.5" />
        
        <!-- Internal Branch Tip Nodes -->
        <circle cx="300" cy="380" r="9" />
        <circle cx="500" cy="380" r="9" />
        <circle cx="300" cy="280" r="9" />
        <circle cx="500" cy="280" r="9" />
        <circle cx="310" cy="210" r="8" />
        <circle cx="490" cy="210" r="8" />
    </g>
</svg>
