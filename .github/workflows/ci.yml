name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'checkpoint/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      BCRYPT_ROUNDS: '4'
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      ENFORCE_TERMINAL_BINDING: 'false'
      ENFORCE_TIMECARDS: 'false'
      MAIL_MAILER: array
      NIGHTWATCH_ENABLED: 'false'
      PULSE_ENABLED: 'false'
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, json, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          ini-values: memory_limit=-1

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/ci.sqlite

      - name: Run migrations
        env:
          DB_DATABASE: database/ci.sqlite
        run: php artisan migrate:fresh --force --no-interaction

      - name: Validate route registration
        env:
          DB_DATABASE: database/ci.sqlite
        run: php artisan route:list

      - name: Run Pest suite
        env:
          DB_DATABASE: ':memory:'
        run: |
          set -o pipefail
          mkdir -p storage/test-results
          php -d memory_limit=-1 ./vendor/bin/pest \
            --colors=never \
            --display-errors \
            --display-warnings \
            --display-deprecations \
            --display-notices \
            --log-junit storage/test-results/pest-junit.xml \
            2>&1 | tee storage/test-results/pest.log

      - name: Summarize Pest diagnostics
        if: failure()
        run: |
          php <<'PHP'
          <?php

          function annotation_value(string $value): string
          {
              $value = str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], $value);

              return mb_substr($value, 0, 900);
          }

          $junitPath = 'storage/test-results/pest-junit.xml';
          $logPath = 'storage/test-results/pest.log';

          if (! file_exists($junitPath)) {
              $fallback = file_exists($logPath) ? substr((string) file_get_contents($logPath), -4000) : 'Pest failed before writing diagnostics.';
              echo '::error title=Pest diagnostics missing::' . annotation_value($fallback) . PHP_EOL;
              exit(0);
          }

          $report = simplexml_load_file($junitPath);
          $failures = $report === false ? [] : $report->xpath('//testcase[failure or error]');

          if ($failures === false || count($failures) === 0) {
              $fallback = file_exists($logPath) ? substr((string) file_get_contents($logPath), -4000) : 'Pest exited non-zero without JUnit failures.';
              echo '::error title=Pest failed::' . annotation_value($fallback) . PHP_EOL;
              exit(0);
          }

          foreach (array_slice($failures, 0, 20) as $case) {
              $class = trim((string) $case['classname']);
              $name = trim((string) $case['name']);
              $defect = count($case->failure) > 0 ? $case->failure[0] : $case->error[0];
              $message = trim((string) ($defect['message'] ?? ''));

              if ($message === '') {
                  $message = trim((string) $defect);
              }

              $message = preg_replace('/\s+/', ' ', $message) ?: 'Pest test failed without a message.';
              $title = trim($class . ' ' . $name);

              echo '::error title=' . annotation_value('Pest failed: ' . $title) . '::' . annotation_value($message) . PHP_EOL;
          }
          PHP

      - name: Upload Pest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pest-diagnostics
          path: storage/test-results/
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
